<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團隊成員 — 洋蔥女裝 Bot</title>
  <style>
    body {
      font-family: "SF Pro Display", "-apple-system", "Noto Sans TC", sans-serif;
      background-color: #fafafa;
      color: #1e293b;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-image: radial-gradient(#ff660008 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      box-sizing: border-box;
      z-index: 1000;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: #0f172a;
      text-decoration: none;
      font-size: 1.15em;
    }
    .nav-brand img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .nav-toggle {
      display: none;
    }
    .nav-toggle-label {
      display: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      padding: 10px;
    }
    .nav-toggle-label span {
      display: block;
      width: 22px;
      height: 2px;
      background-color: #1e293b;
      border-radius: 2px;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .nav-links {
      display: flex;
      gap: 8px;
    }
    .nav-links a {
      color: #475569;
      text-decoration: none;
      font-size: 0.95em;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: #FF6600;
      background-color: #fff5f0;
    }

    .container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 120px 24px 60px 24px;
      box-sizing: border-box;
    }
    
    h1 {
      color: #FF6600;
      font-size: 2.2em;
      font-weight: 800;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
      text-align: center;
    }
    .section-subtitle {
      text-align: center;
      color: #64748b;
      font-size: 1.05em;
      margin-bottom: 48px;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }
    .member-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      transition: all 0.25s ease;
    }
    .member-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(255, 102, 0, 0.05);
      border-color: #ff660030;
    }
    .member-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #ffebe0;
    }
    .member-name {
      font-size: 1.25em;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 4px 0;
    }
    .member-role {
      display: inline-block;
      font-size: 0.82em;
      font-weight: 700;
      background-color: #fff5f0;
      color: #FF6600;
      padding: 4px 12px;
      border-radius: 50px;
      margin-bottom: 16px;
    }
    .member-bio {
      font-size: 0.9em;
      color: #64748b;
      margin: 0;
      line-height: 1.6;
    }

    footer {
      background-color: #ffffff;
      border-top: 1px solid #e2e8f0;
      padding: 28px 20px;
      text-align: center;
      margin-top: auto;
    }
    .copyright {
      font-size: 0.85em;
      color: #94a3b8;
      margin: 0;
    }
    .copyright a {
      color: #ff6600;
      text-decoration: none;
      font-weight: 600;
    }
    .copyright a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .nav-toggle-label { display: flex; }
      .nav-links {
        position: absolute;
        top: 64px;
        left: 0;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.98);
        border-bottom: 1px solid #e2e8f0;
        flex-direction: column;
        gap: 0;
        padding: 8px 0;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.25s ease;
      }
      .nav-links a {
        width: 100%;
        border-radius: 0;
        padding: 14px 24px;
        box-sizing: border-box;
      }
      .nav-toggle:checked ~ .nav-links {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .nav-toggle:checked ~ .nav-toggle-label span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .nav-toggle:checked ~ .nav-toggle-label span:nth-child(2) { opacity: 0; }
      .nav-toggle:checked ~ .nav-toggle-label span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">
      <img src="images/bot/image-onion.jpg" alt="Logo">
      <span>洋蔥女裝 Bot</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">
      <span></span>
      <span></span>
      <span></span>
    </label>
    <div class="nav-links">
      <a href="/team" class="active">團隊成員</a>
      <a href="/privacy">隱私權政策</a>
      <a href="/terms">服務條款</a>
    </div>
  </nav>

  <div class="container">
    <h1>👥 幕後製作團隊</h1>
    <p class="section-subtitle">打造與維護洋蔥女裝 Bot 的成員</p>
    
    <div class="team-grid">
      <div class="member-card">
        <img src="images/avatar-2023.jpg" alt="2023" class="member-avatar">
        <h3 class="member-name">2023</h3>
        <span class="member-role">創辦人 / 程式開發</span>
        <p class="member-bio">負責機器人核心系統架構設計、研發、以及官方網站與資料庫開發維護。</p>
      </div>

      <div class="member-card">
        <img src="images/DECISION-MAKING-TEAM-logo.png" alt="墨狐決策團隊" class="member-avatar">
        <h3 class="member-name">墨狐決策團隊</h3>
        <span class="member-role">社群營運 / 專案企劃</span>
        <p class="member-bio">管理墨狐酒館群組及旗下服務。</p>
      </div>
    </div>
  </div>

  <footer>
    <p class="copyright">&copy; 2026 <a href="https://mofox.xyz" target="_blank">墨狐酒館</a>決策團隊. All rights reserved.</p>
  </footer>

</body>
</html>
