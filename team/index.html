<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團隊成員 — 洋蔥女裝 Bot</title>
    <link rel="icon" type="image/jpeg" href="images/bot/image-onion.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f6f2;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border: rgba(212, 203, 191, 0.5);
            --accent: #d97724;
            --accent-glow: rgba(217, 119, 36, 0.15);
            --text-main: #2c2c2c;
            --text-muted: #736d65;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(230,220,205,0.6) 0%, rgba(247,246,242,0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(40px);
            animation: float 12s infinite alternate ease-in-out;
        }

        .bg-blob-1 { top: -100px; left: -100px; }
        .bg-blob-2 { bottom: -100px; right: -100px; animation-delay: -6s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        .nav-container {
            width: 100%;
            max-width: 800px;
            padding: 24px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 1s forwards ease-out 0.2s;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 101;
        }

        .hamburger span {
            width: 100%;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
            background-color: var(--accent);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
            background-color: var(--accent);
        }

        .nav-bar {
            display: flex;
            gap: 28px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95em;
            letter-spacing: 1px;
            padding: 6px 4px;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background-color: var(--accent);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover {
            color: var(--text-main);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .nav-link.active {
            color: var(--accent);
        }

        header {
            width: 90%;
            max-width: 720px;
            text-align: center;
            margin: 20px 0 40px;
            opacity: 0;
            animation: fadeInUp 1s forwards ease-out 0.4s;
        }

        h1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-bottom: 16px;
        }

        .title-main {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.6em;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 4px;
            line-height: 1.1;
        }

        .title-sub {
            font-family: 'Caveat', cursive;
            font-size: 1.6em;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 0.9em;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        main {
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp 1s forwards ease-out 0.6s;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .member-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 28px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.3s ease;
        }

        .member-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px var(--accent-glow);
            border-color: var(--accent);
        }

        .member-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
            border: 2px solid var(--border);
            transition: border-color 0.3s ease;
        }

        .member-card:hover .member-avatar {
            border-color: var(--accent);
        }

        .member-name {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.3em;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .member-role {
            display: inline-block;
            font-size: 0.85em;
            color: var(--accent);
            background: rgba(217, 119, 36, 0.08);
            border: 1px solid rgba(217, 119, 36, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .member-bio {
            font-size: 0.9em;
            color: var(--text-muted);
            line-height: 1.7;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        footer {
            margin-top: auto;
            padding: 30px 0;
            text-align: center;
            font-size: 0.8em;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeIn 1s forwards ease-out 0.8s;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--accent);
        }

        footer p {
            margin-top: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 680px) {
            .nav-container {
                justify-content: flex-end;
                padding: 16px 20px;
            }

            .hamburger {
                display: flex;
            }

            .nav-bar {
                position: absolute;
                top: 100%;
                right: 20px;
                width: 200px;
                background: var(--card-bg);
                border: 1px solid var(--border);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-radius: 16px;
                padding: 12px 0;
                flex-direction: column;
                gap: 4px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.08);
                opacity: 0;
                visibility: hidden;
                transform: translateY(-10px);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav-bar.active {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }

            .nav-link {
                padding: 12px 20px;
                text-align: center;
                display: block;
                font-size: 0.9em;
            }

            .nav-link::after {
                display: none;
            }

            header {
                margin: 10px 0 24px;
            }

            .title-main {
                font-size: 2.1em;
            }

            .title-sub {
                font-size: 1.4em;
            }

            .team-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <div class="nav-container">
        <button class="hamburger" id="hamburger-btn" aria-label="選單">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-bar" id="nav-menu">
            <a href="/" class="nav-link">首頁</a>
            <a href="/team" class="nav-link active">團隊成員</a>
            <a href="/privacy" class="nav-link">隱私權政策</a>
            <a href="/terms" class="nav-link">服務條款</a>
        </nav>
    </div>

    <header>
        <h1>
            <span class="title-main">團隊成員</span>
            <span class="title-sub">Team Members</span>
        </h1>
        <div class="subtitle">
            <span>「打造與維護洋蔥女裝 Bot 的成員」</span>
        </div>
    </header>

    <main>
        <div class="team-grid">
            <div class="member-card">
                <img src="https://mofox.xyz/db/userimages/S__2899973.jpg" alt="2023" class="member-avatar">
                <h3 class="member-name">2023</h3>
                <span class="member-role">創辦人 / 程式開發</span>
                <p class="member-bio">負責機器人核心系統架構設計、研發、以及官方網站與資料庫開發維護。</p>
            </div>

            <div class="member-card">
                <img src="images/DECISION-MAKING-TEAM-logo.png" alt="墨狐決策團隊" class="member-avatar">
                <h3 class="member-name">墨狐決策團隊</h3>
                <span class="member-role">社群營運 / 專案企劃</span>
                <p class="member-bio">管理墨狐酒館群組及旗下服務。</p>
            </div>
        </div>
    </main>

    <footer>
        <a href="/privacy">隱私權政策</a> | 
        <a href="/terms">服務條款</a>
        <p>&copy; 2026 <a href="https://mofox.xyz" target="_blank">墨狐酒館</a>決策團隊. All rights reserved.</p>
    </footer>

    <script>
        const btn = document.getElementById('hamburger-btn');
        const menu = document.getElementById('nav-menu');

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            btn.classList.toggle('active');
            menu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && !btn.contains(e.target)) {
                btn.classList.remove('active');
                menu.classList.remove('active');
            }
        });
    </script>
</body>
</html>
